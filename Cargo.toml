[package]
name = "opencode-usage-tracker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "KDE Plasma tray icon that tracks OpenCode Zen free-tier usage"
repository = "https://github.com/mudhairless/opencode-usage-tracker"
homepage = "https://github.com/mudhairless/opencode-usage-tracker"
documentation = "https://github.com/mudhairless/opencode-usage-tracker"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ksni = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml_edit = "0.22"
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }
