name: Release

# Tag a version (git tag v0.2.0, then push the tag) and this builds
# the release: the test suite first, then static binaries for x86_64
# and aarch64 that run on any Linux distribution, published as a
# GitHub release with checksums. The tag must match the version in
# Cargo.toml, so bump that first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Run tests
        run: cargo test --verbose

  # The upload action attaches assets to an existing release; it does
  # not create one. Create it here, once, so both matrix legs upload
  # into the same release instead of racing to create it.
  create:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes

  release:
    needs: [test, create]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Build and upload the binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: opencode-usage-tracker
          target: ${{ matrix.target }}
          tar: all
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
